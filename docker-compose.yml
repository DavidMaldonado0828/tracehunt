services:
  dynamodb-local:
    image: amazon/dynamodb-local
    container_name: tracehunt-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - ./docker/dynamodb:/home/dynamodblocal/data

  dynamodb-init:
    build: ./backend
    image: tracehunt-backend:local
    container_name: tracehunt-dynamodb-init
    command: ["python", "/dynamodb/init_tables.py"]
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    volumes:
      - ./dynamodb:/dynamodb:ro
    depends_on:
      - dynamodb-local
    restart: "no"

  api:
    build: ./backend
    image: tracehunt-backend:local
    container_name: tracehunt-api
    env_file:
      - ./backend/.env
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    ports:
      - "8080:8000"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
